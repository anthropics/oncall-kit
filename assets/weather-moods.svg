<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" role="img"
     aria-label="The four weather moods: sunny (merge freely), partly cloudy (some drag, still moving), overcast (expect delays), stormy (hold and read the report).">
  <title>The four weather moods</title>
  <style>
    .lbl { font: 600 14px system-ui, sans-serif; fill: #2f363d; }
    .cap { font: 12px system-ui, sans-serif; fill: #656d76; }
    .rays  { animation: spin 36s linear infinite; transform-origin: 100px 56px; }
    .drift { animation: drift 7s ease-in-out infinite alternate; }
    .rain  { stroke: #4493f8; stroke-width: 2.5; stroke-linecap: round;
             animation: fall 1.6s linear infinite; }
    .r2 { animation-delay: .55s; }
    .r3 { animation-delay: 1.1s; }
    .bolt { animation: flash 5s linear infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
    @keyframes fall  { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; }
                       80% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
    @keyframes flash { 0%, 82%, 100% { opacity: .35; } 85%, 93% { opacity: 1; } 88% { opacity: .4; } }
    @media (prefers-color-scheme: dark) {
      .lbl { fill: #c9d1d9; }
      .cap { fill: #8b949e; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rays, .drift, .rain, .bolt { animation: none; }
    }
  </style>
  <defs>
    <g id="cloud">
      <circle cx="-11" cy="0" r="10"/>
      <circle cx="3" cy="-5" r="13"/>
      <circle cx="15" cy="2" r="9"/>
      <rect x="-17" y="0" width="40" height="11" rx="5.5"/>
    </g>
  </defs>

  <!-- sunny -->
  <g class="rays" stroke="#e3b341" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="56" x2="130" y2="56"/>
    <line x1="100" y1="26" x2="100" y2="86"/>
    <line x1="78.8" y1="34.8" x2="121.2" y2="77.2"/>
    <line x1="78.8" y1="77.2" x2="121.2" y2="34.8"/>
  </g>
  <circle cx="100" cy="56" r="16" fill="#e3b341"/>
  <text class="lbl" x="100" y="120" text-anchor="middle">Sunny</text>
  <text class="cap" x="100" y="138" text-anchor="middle">merge freely</text>

  <!-- partly cloudy -->
  <circle cx="292" cy="46" r="12" fill="#e3b341"/>
  <g class="drift" fill="#98a1ab">
    <use href="#cloud" x="304" y="62"/>
  </g>
  <text class="lbl" x="300" y="120" text-anchor="middle">Partly cloudy</text>
  <text class="cap" x="300" y="138" text-anchor="middle">some drag, still moving</text>

  <!-- overcast -->
  <use href="#cloud" x="522" y="42" fill="#8b949e" opacity=".45"/>
  <use href="#cloud" x="500" y="56" fill="#8b949e"/>
  <use href="#cloud" x="478" y="48" fill="#8b949e" opacity=".65"/>
  <text class="lbl" x="500" y="120" text-anchor="middle">Overcast</text>
  <text class="cap" x="500" y="138" text-anchor="middle">expect delays</text>

  <!-- stormy -->
  <g transform="translate(700 54) scale(1.2)">
    <use href="#cloud" fill="#6e7681"/>
  </g>
  <line class="rain" x1="682" y1="72" x2="679" y2="80"/>
  <line class="rain r2" x1="722" y1="72" x2="719" y2="80"/>
  <line class="rain r3" x1="672" y1="78" x2="669" y2="86"/>
  <polygon class="bolt" fill="#e3b341"
           points="703,70 690,88 699,88 693,104 712,84 702,84 708,70"/>
  <text class="lbl" x="700" y="120" text-anchor="middle">Stormy</text>
  <text class="cap" x="700" y="138" text-anchor="middle">hold — read the report</text>
</svg>
